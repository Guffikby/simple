<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple. ГДЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --text-color: var(--tg-theme-text-color, #222222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-bg: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        h2 { 
            margin: 10px 0; 
            font-size: 20px; 
        }

        .book-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .book-title { 
            font-weight: bold; 
            font-size: 17px; 
            margin-bottom: 2px; 
        }

        .book-subtitle { 
            font-size: 13px; 
            color: var(--hint-color); 
            margin-bottom: 12px; 
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--button-bg);
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .task-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 12px;
            font-size: 22px;
            cursor: pointer;
            color: var(--hint-color);
        }

        .loader { 
            text-align: center; 
            padding: 40px; 
            color: var(--hint-color); 
        }
    </style>
</head>
<body>

    <h2>📚 Simple. ГДЗ</h2>
    <div id="content">
        <div class="loader">Загрузка решений...</div>
    </div>

    <div id="solutionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-top: 0;"></h3>
            <p id="modalCaption" style="font-size: 14px; color: var(--hint-color);"></p>
            <img id="modalImg" src="" alt="Решение">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚙️ УКАЖИ ССЫЛКУ НА СВОЙ СЕРВЕР ИЛИ ТУННЕЛЬ
        const BACKEND_URL = "https://твой-адрес-из-pinggy.pinggy.link";

        async function loadData() {
            try {
                const baseUrl = BACKEND_URL.startsWith("http") ? BACKEND_URL : "";
                const response = await fetch(`${baseUrl}/api/data`);
                const books = await response.json();
                const container = document.getElementById('content');
                container.innerHTML = '';

                if (books.length === 0) {
                    container.innerHTML = '<div class="loader">Решений пока нет</div>';
                    return;
                }

                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';

                    let tasksHtml = '';

                    if (book.tasks && book.tasks.length > 0) {
                        // Группируем задания по ЛЮБОМУ типу, введённому админом
                        const grouped = {};
                        book.tasks.forEach(t => {
                            const typeName = t.task_type || 'Задания';
                            if (!grouped[typeName]) grouped[typeName] = [];
                            grouped[typeName].push(t);
                        });

                        // Выводим сгенерированные категории
                        for (const [typeTitle, tasks] of Object.entries(grouped)) {
                            tasksHtml += `<div class="section-title">📌 ${typeTitle}</div>`;
                            tasksHtml += '<div class="tasks-grid">';
                            
                            tasks.forEach(t => {
                                const title = `${t.topic} — ${t.task_number} (${typeTitle})`;
                                const photoUrl = `${baseUrl}${t.photo_url}`;
                                tasksHtml += `<button class="task-btn" onclick="openSolution('${photoUrl}', '${title}', '${t.answer_text}')">${t.task_number}</button>`;
                            });

                            tasksHtml += '</div>';
                        }
                    } else {
                        tasksHtml = '<div style="font-size: 12px; color: var(--hint-color);">Нет загруженных номеров</div>';
                    }

                    card.innerHTML = `
                        <div class="book-title">${book.title}</div>
                        <div class="book-subtitle">${book.subject} • ${book.grade} (${book.year}г.)</div>
                        ${tasksHtml}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('content').innerHTML = '<div class="loader">Ошибка загрузки данных.<br>Проверь соединение с сервером.</div>';
            }
        }

        function openSolution(url, title, caption) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalCaption').innerText = caption || '';
            document.getElementById('modalImg').src = url;
            document.getElementById('solutionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('solutionModal').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
