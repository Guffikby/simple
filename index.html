<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple. ГДЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --text-color: var(--tg-theme-text-color, #222222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-bg: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--button-bg);
            display: none;
            padding: 0;
        }

        h2 { margin: 0; font-size: 20px; }

        /* Сетка предметов */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .subject-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        /* Список учебников */
        .books-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .book-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .book-cover {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #eee;
        }

        .book-info {
            display: flex;
            flex-direction: column;
        }

        .book-title { font-weight: bold; font-size: 16px; }
        .book-sub { font-size: 13px; color: var(--hint-color); margin-top: 4px; }

        /* Иерархия упражнений */
        .chapter-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--button-bg);
            margin: 16px 0 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 4px;
        }

        .type-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            margin: 8px 0 4px 0;
            text-transform: uppercase;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .task-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 12px;
            font-size: 22px;
            cursor: pointer;
            color: var(--hint-color);
        }

        .loader { text-align: center; padding: 40px; color: var(--hint-color); }
    </style>
</head>
<body>

    <div class="header">
        <button id="backBtn" class="back-btn" onclick="goBack()">⬅️</button>
        <h2 id="viewTitle">📚 Выберите предмет</h2>
    </div>

    <div id="content">
        <div class="loader">Загрузка предметов...</div>
    </div>

    <div id="solutionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-top: 0;"></h3>
            <p id="modalCaption" style="font-size: 14px; color: var(--hint-color);"></p>
            <img id="modalImg" src="" alt="Решение">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://simplegdzby.onrender.com";

        let catalogData = [];
        let currentSubject = null;
        let currentBook = null;

        async function init() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/data`);
                catalogData = await response.json();
                renderSubjects();
            } catch (err) {
                document.getElementById('content').innerHTML = '<div class="loader">Ошибка загрузки данных.</div>';
            }
        }

        function renderSubjects() {
            currentSubject = null;
            currentBook = null;
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('viewTitle').innerText = '📚 Выберите предмет';

            const container = document.getElementById('content');
            if (catalogData.length === 0) {
                container.innerHTML = '<div class="loader">Предметы не найдены</div>';
                return;
            }

            let html = '<div class="grid-container">';
            catalogData.forEach((s, idx) => {
                html += `<div class="subject-card" onclick="openSubject(${idx})">📐 ${s.title}</div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function openBook(bIdx) {
    currentBook = currentSubject.books[bIdx];
    document.getElementById('backBtn').style.display = 'block';
    document.getElementById('viewTitle').innerText = currentBook.title;

    const container = document.getElementById('content');
    if (!currentBook.tasks || currentBook.tasks.length === 0) {
        container.innerHTML = '<div class="loader">Решений пока нет</div>';
        return;
    }

    // Полное построение дерева: Глава -> Параграф -> Категория -> Задания
    const tree = {};
    currentBook.tasks.forEach(t => {
        const ch = t.chapter || 'Раздел';
        const p = t.paragraph || 'Параграф';
        const cat = t.category || 'Задания';

        if (!tree[ch]) tree[ch] = {};
        if (!tree[ch][p]) tree[ch][p] = {};
        if (!tree[ch][p][cat]) tree[ch][p][cat] = [];

        tree[ch][p][cat].push(t);
    });

    let html = '';
    for (const [chName, paragraphs] of Object.entries(tree)) {
        html += `<div class="chapter-block">`;
        html += `<div class="chapter-title">📖 ${chName}</div>`;

        for (const [pName, categories] of Object.entries(paragraphs)) {
            // Выводим Параграф (например: § 1.2)
            html += `<div class="paragraph-title">📑 ${pName}</div>`;

            for (const [catName, tasks] of Object.entries(categories)) {
                // Выводим Категорию (например: Вопросы, Упражнения)
                html += `<div class="category-title">📌 ${catName}</div>`;
                html += '<div class="tasks-grid">';
                
                tasks.forEach(t => {
                    const title = `${pName} • ${catName} • ${t.task_number}`;
                    const imgUrl = `${BACKEND_URL}${t.photo_url}`;
                    html += `<button class="task-btn" onclick="openSolution('${imgUrl}', '${title}', '${t.answer_text}')">${t.task_number}</button>`;
                });

                html += '</div>';
            }
        }
        html += `</div>`;
    }

    container.innerHTML = html;
}

        function openBook(bIdx) {
            currentBook = currentSubject.books[bIdx];
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('viewTitle').innerText = currentBook.title;

            const container = document.getElementById('content');
            if (!currentBook.tasks || currentBook.tasks.length === 0) {
                container.innerHTML = '<div class="loader">Решений пока нет</div>';
                return;
            }

            // Группировка: Глава -> Тип упражнения -> Список номеров
            const chapters = {};
            currentBook.tasks.forEach(t => {
                const ch = t.chapter || 'Без главы';
                const tp = t.task_type || 'Задания';

                if (!chapters[ch]) chapters[ch] = {};
                if (!chapters[ch][tp]) chapters[ch][tp] = [];
                chapters[ch][tp].push(t);
            });

            let html = '';
            for (const [chTitle, types] of Object.entries(chapters)) {
                html += `<div class="chapter-title">📖 ${chTitle}</div>`;
                for (const [tpTitle, tasks] of Object.entries(types)) {
                    html += `<div class="type-title">📌 ${tpTitle}</div>`;
                    html += '<div class="tasks-grid">';
                    tasks.forEach(t => {
                        const title = `${chTitle} -> ${tpTitle} (${t.task_number})`;
                        const imgUrl = `${BACKEND_URL}${t.photo_url}`;
                        html += `<button class="task-btn" onclick="openSolution('${imgUrl}', '${title}', '${t.answer_text}')">${t.task_number}</button>`;
                    });
                    html += '</div>';
                }
            }

            container.innerHTML = html;
        }

        function goBack() {
            if (currentBook) {
                openSubject(catalogData.indexOf(currentSubject));
            } else if (currentSubject) {
                renderSubjects();
            }
        }

        function openSolution(url, title, caption) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalCaption').innerText = caption || '';
            document.getElementById('modalImg').src = url;
            document.getElementById('solutionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('solutionModal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
